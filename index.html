<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Ease - Controle Financeiro</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>Finance Ease</h1>
            <p>Seu controle financeiro simplificado</p>
        </div>
        <div class="user-info">
            <span id="welcome-message">Bem-vindo, Carlos Piquet</span>
        </div>
    </header>

    <main>
        <section class="dashboard">
            <div class="balance-card">
                <h2>Saldo Atual</h2>
                <div class="balance" id="total-balance">R$ 0,00</div>
                <div class="summary">
                    <div class="income">
                        <span class="label">Receitas</span>
                        <span class="value" id="total-income">R$ 0,00</span>
                    </div>
                    <div class="expenses">
                        <span class="label">Despesas</span>
                        <span class="value" id="total-expenses">R$ 0,00</span>
                    </div>
                </div>
            </div>

            <div class="transaction-form">
                <h2>Nova Transação</h2>
                <form id="transaction-form">
                    <div class="form-group">
                        <label for="description">Descrição</label>
                        <input type="text" id="description" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Valor (R$)</label>
                        <input type="number" id="amount" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="date">Data</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label for="type">Tipo</label>
                        <select id="type" required>
                            <option value="income">Receita</option>
                            <option value="expense">Despesa</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="category">Categoria</label>
                        <select id="category" required>
                            <option value="salary">Salário</option>
                            <option value="investment">Investimentos</option>
                            <option value="food">Alimentação</option>
                            <option value="transport">Transporte</option>
                            <option value="housing">Moradia</option>
                            <option value="entertainment">Lazer</option>
                            <option value="health">Saúde</option>
                            <option value="education">Educação</option>
                            <option value="other">Outros</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit">Adicionar</button>
                </form>
            </div>
        </section>

        <section class="transactions">
            <h2>Histórico de Transações</h2>
            <div class="filters">
                <div class="filter-group">
                    <label for="filter-month">Mês</label>
                    <select id="filter-month">
                        <option value="all">Todos</option>
                        <option value="1">Janeiro</option>
                        <option value="2">Fevereiro</option>
                        <option value="3">Março</option>
                        <option value="4">Abril</option>
                        <option value="5">Maio</option>
                        <option value="6">Junho</option>
                        <option value="7">Julho</option>
                        <option value="8">Agosto</option>
                        <option value="9">Setembro</option>
                        <option value="10">Outubro</option>
                        <option value="11">Novembro</option>
                        <option value="12">Dezembro</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-type">Tipo</label>
                    <select id="filter-type">
                        <option value="all">Todos</option>
                        <option value="income">Receitas</option>
                        <option value="expense">Despesas</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-category">Categoria</label>
                    <select id="filter-category">
                        <option value="all">Todas</option>
                        <option value="salary">Salário</option>
                        <option value="investment">Investimentos</option>
                        <option value="food">Alimentação</option>
                        <option value="transport">Transporte</option>
                        <option value="housing">Moradia</option>
                        <option value="entertainment">Lazer</option>
                        <option value="health">Saúde</option>
                        <option value="education">Educação</option>
                        <option value="other">Outros</option>
                    </select>
                </div>
            </div>
            <div class="transaction-list" id="transaction-list">
                <!-- Transactions will be added here dynamically -->
                <p class="empty-state">Nenhuma transação encontrada.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Finance Ease - Desenvolvido por Carlos Piquet</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
